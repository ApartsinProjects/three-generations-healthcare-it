<svg viewBox="0 0 700 128" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:600px">
    <g font-family="Arial, sans-serif" font-size="10.5">
      <text x="350" y="18" fill="#33475b" text-anchor="middle" font-style="italic" font-size="11.5">the Actionable Clinical Record</text>
      <rect x="16"  y="32" width="78" height="28" fill="#e7edf3" stroke="#10233b"/><text x="55"  y="50" fill="#10233b" text-anchor="middle">action</text>
      <rect x="100" y="32" width="72" height="28" fill="#fff" stroke="#8a95a3"/><text x="136" y="50" fill="#33475b" text-anchor="middle">target</text>
      <rect x="178" y="32" width="64" height="28" fill="#fff" stroke="#8a95a3"/><text x="210" y="50" fill="#33475b" text-anchor="middle">actor</text>
      <rect x="248" y="32" width="118" height="28" fill="#fff" stroke="#8a95a3"/><text x="307" y="50" fill="#33475b" text-anchor="middle">temporal constr.</text>
      <rect x="372" y="32" width="84" height="28" fill="#fff" stroke="#8a95a3"/><text x="414" y="50" fill="#33475b" text-anchor="middle">condition</text>
      <rect x="462" y="32" width="102" height="28" fill="#fff" stroke="#8a95a3"/><text x="513" y="50" fill="#33475b" text-anchor="middle">dependency</text>
      <rect x="570" y="32" width="70" height="28" fill="#e7edf3" stroke="#10233b"/><text x="605" y="50" fill="#10233b" text-anchor="middle">status</text>
      <rect x="140" y="72" width="150" height="28" fill="#e7edf3" stroke="#10233b"/><text x="215" y="90" fill="#10233b" text-anchor="middle">provenance</text>
      <rect x="300" y="72" width="130" height="28" fill="#fff" stroke="#8a95a3"/><text x="365" y="90" fill="#33475b" text-anchor="middle">confidence</text>
      <text x="350" y="118" fill="#7b8794" text-anchor="middle" font-size="9">shaded = required (action, status, provenance) · outlined = optional fields</text>
    </g>
  </svg>